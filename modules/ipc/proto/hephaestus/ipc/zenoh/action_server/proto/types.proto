syntax = "proto3";

package heph.ipc.zenoh.action_server.proto;

import "google/protobuf/any.proto";

message Request {
  google.protobuf.Any request = 1;
  string uid = 2;
}

enum RequestStatus {
  REQUEST_STATUS_UNSPECIFIED = 0;
  REQUEST_STATUS_SUCCESSFUL = 1;
  REQUEST_STATUS_REJECTED_USER = 2;
  REQUEST_STATUS_REJECTED_ALREADY_RUNNING = 3;
  REQUEST_STATUS_INVALID = 4;
  REQUEST_STATUS_STOPPED = 5;
}

message RequestResponse {
  RequestStatus status = 1;
}

message Response {
  RequestStatus status = 1;
  google.protobuf.Any value = 2;
}
